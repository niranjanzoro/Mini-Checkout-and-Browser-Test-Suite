<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini Checkout</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
      padding: 2rem 1rem;
      min-height: 100vh;
    }

    h1 { font-size: 1.75rem; margin-bottom: 1.5rem; text-align: center; }
    h2 { font-size: 1.15rem; margin-bottom: 0.75rem; color: #3c3c43; }

    .layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      max-width: 880px;
      margin: 0 auto;
    }
    @media (max-width: 640px) { .layout { grid-template-columns: 1fr; } }

    .card {
      background: #fff;
      border-radius: 12px;
      padding: 1.25rem;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }
    .full-width { max-width: 880px; margin: 1.5rem auto 0; }

    .product-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 0;
      border-bottom: 1px solid #e5e5ea;
    }
    .product-item:last-child { border-bottom: none; }
    .product-price { color: #636366; margin-right: 0.75rem; font-variant-numeric: tabular-nums; }

    button {
      cursor: pointer;
      border: none;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 600;
      padding: 0.4rem 0.9rem;
      transition: background 0.15s ease, opacity 0.15s ease;
    }
    button:disabled { opacity: 0.45; cursor: not-allowed; }

    .btn-add    { background: #0071e3; color: #fff; }
    .btn-add:hover:not(:disabled) { background: #0077ed; }
    .btn-qty    { background: #e5e5ea; color: #1d1d1f; padding: 0.3rem 0.65rem; min-width: 2rem; }
    .btn-qty:hover:not(:disabled) { background: #d1d1d6; }
    .btn-remove { background: #ff3b30; color: #fff; padding: 0.3rem 0.7rem; }
    .btn-remove:hover:not(:disabled) { background: #e02d23; }
    .btn-place  { background: #34c759; color: #fff; width: 100%; padding: 0.75rem; font-size: 1rem; margin-top: 1rem; }
    .btn-place:hover:not(:disabled) { background: #2db84d; }
    .btn-new    { background: #0071e3; color: #fff; margin-top: 1.25rem; padding: 0.6rem 1.2rem; }
    .btn-new:hover { background: #0077ed; }

    .cart-line {
      display: grid;
      grid-template-columns: 1fr auto auto auto;
      gap: 0.5rem;
      align-items: center;
      padding: 0.6rem 0;
      border-bottom: 1px solid #e5e5ea;
    }
    .cart-line:last-child { border-bottom: none; }
    .cart-line-name { font-weight: 500; }
    .qty-wrap { display: flex; align-items: center; gap: 0.3rem; }
    .qty-input {
      width: 3.2rem;
      text-align: center;
      border: 1px solid #c7c7cc;
      border-radius: 6px;
      padding: 0.25rem 0.3rem;
      font-size: 0.9rem;
    }
    .qty-input::-webkit-inner-spin-button,
    .qty-input::-webkit-outer-spin-button { -webkit-appearance: none; }
    .qty-input { -moz-appearance: textfield; }

    .line-total { text-align: right; min-width: 4.5rem; font-variant-numeric: tabular-nums; }

    .total-row {
      display: flex;
      justify-content: space-between;
      font-weight: 700;
      font-size: 1.1rem;
      margin-top: 0.75rem;
      padding-top: 0.75rem;
      border-top: 2px solid #e5e5ea;
    }

    label { display: block; font-weight: 600; margin-bottom: 0.35rem; }
    input[type="text"] {
      width: 100%;
      border: 1px solid #c7c7cc;
      border-radius: 8px;
      padding: 0.55rem 0.75rem;
      font-size: 1rem;
    }
    input[type="text"]:focus { outline: 2px solid #0071e3; border-color: transparent; }
    input[aria-invalid="true"] { border-color: #ff3b30; outline-color: #ff3b30; }

    .error {
      color: #ff3b30;
      font-size: 0.875rem;
      margin-top: 0.4rem;
      font-weight: 500;
    }

    .status-msg {
      color: #d97706;
      font-size: 0.875rem;
      margin-top: 0.4rem;
      font-weight: 500;
    }

    .empty-msg { color: #8e8e93; font-style: italic; padding: 0.5rem 0; }

    .confirm-box {
      background: #fff;
      border-radius: 12px;
      padding: 2rem;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      max-width: 880px;
      margin: 0 auto;
      text-align: center;
    }
    .confirm-box h2 { color: #34c759; font-size: 1.6rem; margin-bottom: 1rem; }
    .confirm-details {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin: 1rem 0;
      text-align: left;
      background: #f9f9fb;
      padding: 1rem;
      border-radius: 8px;
    }
    .ref-code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 1.1rem; font-weight: 700; color: #0071e3; }
    .item-list { margin: 1rem 0; text-align: left; list-style: none; padding: 0; }
    .item-list li {
      padding: 0.5rem 0;
      border-bottom: 1px solid #e5e5ea;
      display: flex;
      justify-content: space-between;
    }
    .item-list li:last-child { border-bottom: none; }
    .confirm-total-row {
      font-size: 1.2rem;
      font-weight: 700;
      margin-top: 1rem;
      padding-top: 0.75rem;
      border-top: 2px solid #e5e5ea;
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>

  <!-- Polite live region for screen-reader announcements -->
  <div id="sr-live"
       aria-live="polite"
       aria-atomic="true"
       style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;"></div>

  <div id="checkout-view">
    <h1>Mini Checkout</h1>

    <div class="layout">
      <!-- Products -->
      <div class="card">
        <h2>Products</h2>

        <div class="product-item">
          <span><strong>Notebook</strong></span>
          <span>
            <span class="product-price">$4.50</span>
            <button type="button"
                    class="btn-add"
                    data-testid="product-notebook-add"
                    data-product="notebook"
                    aria-label="Add Notebook to cart">Add to Cart</button>
          </span>
        </div>

        <div class="product-item">
          <span><strong>Pen Set</strong></span>
          <span>
            <span class="product-price">$12.00</span>
            <button type="button"
                    class="btn-add"
                    data-testid="product-pen-add"
                    data-product="pen"
                    aria-label="Add Pen Set to cart">Add to Cart</button>
          </span>
        </div>
      </div>

      <!-- Cart -->
      <div class="card">
        <h2>Your Cart</h2>

        <div id="cart-error"
             data-testid="cart-error"
             class="error"
             role="alert"
             style="display:none;"></div>

        <div id="qty-max-message"
             data-testid="qty-max-message"
             class="status-msg"
             role="status"
             style="display:none;">Maximum quantity is 99.</div>

        <p id="cart-empty-msg"
           data-testid="cart-empty-message"
           class="empty-msg">Your cart is empty — add a product above.</p>

        <div id="cart-lines"></div>

        <div class="total-row">
          <span>Order Total</span>
          <span id="order-total" data-testid="order-total">$0.00</span>
        </div>
      </div>
    </div>

    <!-- Order details -->
    <div class="card full-width">
      <h2>Your Details</h2>

      <label for="name-input">Full Name <span aria-hidden="true">*</span></label>
      <input type="text"
             id="name-input"
             data-testid="name-input"
             autocomplete="name"
             maxlength="60"
             placeholder="e.g. Jane Smith" />

      <div id="name-error"
           data-testid="name-error"
           class="error"
           role="alert"
           style="display:none;"></div>

      <button type="button"
              id="place-order-btn"
              data-testid="place-order"
              class="btn-place">Place Order</button>
    </div>
  </div>

  <!-- Confirmation Mount Point -->
  <div id="confirmation-mount"></div>

  <script>
    /* ================================================================
       DATA MODEL & CONSTANTS
       Integer cents everywhere; formatting only for display.
    ================================================================ */

    const PRODUCTS = {
      notebook: { label: 'Notebook', priceCents: 450 },
      pen:      { label: 'Pen Set',  priceCents: 1200 },
    };

    /** cart: Map<productKey, { priceCents: number, qty: number }> */
    let cart = new Map();

    /** Page-session set of generated references to guarantee session uniqueness */
    const usedReferences = new Set();

    /** Double-submit protection flags */
    let isSubmitting = false;
    let orderPlaced  = false;

    /* ── Pure helpers ─────────────────────────────────────────────── */

    function formatCents(cents) {
      const abs = Math.abs(cents);
      return (cents < 0 ? '-' : '') +
             '$' + Math.floor(abs / 100) + '.' +
             String(abs % 100).padStart(2, '0');
    }

    /**
     * Clamp input to integer in [1, 99].
     * Blank, 0, negative, decimal (e.g. "2.7") or non-numeric becomes 1.
     * Over 99 becomes 99.
     */
    function clampQty(raw) {
      if (typeof raw === 'string' && raw.trim() === '') return 1;
      const n = Number(raw);
      if (!Number.isFinite(n) || !Number.isInteger(n) || n < 1) return 1;
      if (n > 99) return 99;
      return n;
    }

    function orderTotalCents() {
      let total = 0;
      for (const { priceCents, qty } of cart.values()) total += priceCents * qty;
      return total;
    }

    /**
     * Generate ORD- followed by 8 uppercase alphanumerics from crypto.getRandomValues.
     * Clashes are regenerated against usedReferences.
     */
    function generateRef() {
      const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
      let ref;
      do {
        const bytes = new Uint8Array(8);
        crypto.getRandomValues(bytes);
        let s = 'ORD-';
        for (let i = 0; i < 8; i++) {
          s += chars[bytes[i] % chars.length];
        }
        ref = s;
      } while (usedReferences.has(ref));
      usedReferences.add(ref);
      return ref;
    }

    function announce(msg) {
      const el = document.getElementById('sr-live');
      el.textContent = '';
      requestAnimationFrame(() => { el.textContent = msg; });
    }

    function showError(id, msg) {
      const el = document.getElementById(id);
      el.textContent = msg;
      el.style.display = msg ? '' : 'none';
    }

    function clearError(id) { showError(id, ''); }

    function updateMaxQtyNotice() {
      const maxEl = document.getElementById('qty-max-message');
      let hasMax = false;
      for (const { qty } of cart.values()) {
        if (qty >= 99) { hasMax = true; break; }
      }
      maxEl.style.display = hasMax ? '' : 'none';
    }

    function updateCartUI() {
      const emptyMsgEl = document.getElementById('cart-empty-msg');
      const totalEl    = document.getElementById('order-total');

      if (cart.size === 0) {
        emptyMsgEl.style.display = '';
        totalEl.textContent = '$0.00';
      } else {
        emptyMsgEl.style.display = 'none';
        totalEl.textContent = formatCents(orderTotalCents());
      }
      updateMaxQtyNotice();
    }

    function updateLineInPlace(key) {
      const item = cart.get(key);
      if (!item) return;
      const lineEl = document.querySelector(`[data-testid="cart-line-${key}"]`);
      if (!lineEl) {
        render();
        return;
      }
      const input = lineEl.querySelector(`[data-testid="qty-${key}"]`);
      if (input) {
        input.value = String(item.qty);
      }
      const lineTotalEl = lineEl.querySelector(`[data-testid="line-total-${key}"]`);
      if (lineTotalEl) {
        lineTotalEl.textContent = formatCents(item.priceCents * item.qty);
      }
      const decBtn = lineEl.querySelector('[data-action="dec"]');
      if (decBtn) {
        decBtn.disabled = (item.qty <= 1);
      }
      const incBtn = lineEl.querySelector('[data-action="inc"]');
      if (incBtn) {
        incBtn.disabled = (item.qty >= 99);
      }
      updateCartUI();
    }

    /* ── Render Cart ──────────────────────────────────────────────── */

    function render() {
      const linesEl    = document.getElementById('cart-lines');
      linesEl.replaceChildren();

      if (cart.size === 0) {
        updateCartUI();
        return;
      }

      for (const [key, { priceCents, qty }] of cart.entries()) {
        const lineCents = priceCents * qty;
        const div = document.createElement('div');
        div.className = 'cart-line';
        div.setAttribute('data-testid', `cart-line-${key}`);

        const nameSpan = document.createElement('span');
        nameSpan.className = 'cart-line-name';
        nameSpan.textContent = PRODUCTS[key].label;
        div.appendChild(nameSpan);

        const qtyWrap = document.createElement('div');
        qtyWrap.className = 'qty-wrap';

        // Minus button (disabled at 1)
        const decBtn = document.createElement('button');
        decBtn.type = 'button';
        decBtn.className = 'btn-qty';
        decBtn.setAttribute('data-action', 'dec');
        decBtn.setAttribute('data-key', key);
        decBtn.setAttribute('aria-label', `Decrease quantity of ${PRODUCTS[key].label}`);
        decBtn.textContent = '−';
        decBtn.disabled = (qty <= 1);
        qtyWrap.appendChild(decBtn);

        // Quantity input
        const input = document.createElement('input');
        input.type = 'number';
        input.className = 'qty-input';
        input.min = '1';
        input.max = '99';
        input.value = String(qty);
        input.setAttribute('data-testid', `qty-${key}`);
        input.setAttribute('data-key', key);
        input.setAttribute('aria-label', `Quantity for ${PRODUCTS[key].label}`);
        qtyWrap.appendChild(input);

        // Plus button (disabled at 99)
        const incBtn = document.createElement('button');
        incBtn.type = 'button';
        incBtn.className = 'btn-qty';
        incBtn.setAttribute('data-action', 'inc');
        incBtn.setAttribute('data-key', key);
        incBtn.setAttribute('aria-label', `Increase quantity of ${PRODUCTS[key].label}`);
        incBtn.textContent = '+';
        incBtn.disabled = (qty >= 99);
        qtyWrap.appendChild(incBtn);

        div.appendChild(qtyWrap);

        const lineTotalSpan = document.createElement('span');
        lineTotalSpan.className = 'line-total';
        lineTotalSpan.setAttribute('data-testid', `line-total-${key}`);
        lineTotalSpan.textContent = formatCents(lineCents);
        div.appendChild(lineTotalSpan);

        const removeBtn = document.createElement('button');
        removeBtn.type = 'button';
        removeBtn.className = 'btn-remove';
        removeBtn.setAttribute('data-action', 'remove');
        removeBtn.setAttribute('data-key', key);
        removeBtn.setAttribute('data-testid', `remove-${key}`);
        removeBtn.setAttribute('aria-label', `Remove ${PRODUCTS[key].label} from cart`);
        removeBtn.textContent = 'Remove';
        div.appendChild(removeBtn);

        linesEl.appendChild(div);
      }

      updateCartUI();
    }

    /* ── Add to Cart ──────────────────────────────────────────────── */

    document.querySelectorAll('[data-product]').forEach(btn => {
      btn.addEventListener('click', () => {
        const key = btn.dataset.product;
        if (cart.has(key)) {
          const item = cart.get(key);
          if (item.qty >= 99) {
            item.qty = 99;
            showError('qty-max-message', 'Maximum quantity is 99.');
            document.getElementById('qty-max-message').style.display = '';
          } else {
            item.qty += 1;
          }
          clearError('cart-error');
          updateLineInPlace(key);
        } else {
          cart.set(key, { priceCents: PRODUCTS[key].priceCents, qty: 1 });
          clearError('cart-error');
          render();
        }
      });
    });

    /* ── Cart event delegation ────────────────────────────────────── */

    document.getElementById('cart-lines').addEventListener('click', e => {
      const btn = e.target.closest('[data-action]');
      if (!btn) return;
      const key    = btn.dataset.key;
      const action = btn.dataset.action;
      const item   = cart.get(key);
      if (!item) return;

      if (action === 'inc') {
        if (item.qty < 99) {
          item.qty += 1;
        }
        updateLineInPlace(key);
      } else if (action === 'dec') {
        if (item.qty > 1) {
          item.qty -= 1;
        }
        updateLineInPlace(key);
      } else if (action === 'remove') {
        cart.delete(key);
        render();
      }
    });

    function handleQtyInputCommit(e) {
      const inp = e.target;
      if (inp.tagName !== 'INPUT' || !inp.dataset.key) return;
      const key = inp.dataset.key;
      const item = cart.get(key);
      if (!item) return;
      item.qty = clampQty(inp.value);
      updateLineInPlace(key);
    }

    document.getElementById('cart-lines').addEventListener('change', handleQtyInputCommit);
    document.getElementById('cart-lines').addEventListener('focusout', handleQtyInputCommit);

    /* ── Name input: live validation clearing ─────────────────────── */

    const nameInput = document.getElementById('name-input');
    nameInput.addEventListener('input', () => {
      const val = nameInput.value.trim();
      if (val.length > 0 && val.length <= 60) {
        clearError('name-error');
        nameInput.removeAttribute('aria-invalid');
      }
    });

    /* ── Place Order ──────────────────────────────────────────────── */

    function placeOrder() {
      if (isSubmitting || orderPlaced) return;

      let hasError = false;

      // 1. Validate cart first
      if (cart.size === 0) {
        showError('cart-error', 'Your cart is empty — please add at least one item before placing an order.');
        announce('Error: cart is empty');
        hasError = true;
      } else {
        clearError('cart-error');
      }

      // 2. Validate name second
      const rawName = nameInput.value;
      const trimmed = rawName.trim();
      if (trimmed === '') {
        showError('name-error', 'Please enter your full name to continue.');
        nameInput.setAttribute('aria-invalid', 'true');
        announce('Error: full name is required');
        nameInput.focus();
        hasError = true;
      } else if (trimmed.length > 60) {
        showError('name-error', 'Full name must not exceed 60 characters.');
        nameInput.setAttribute('aria-invalid', 'true');
        announce('Error: full name must not exceed 60 characters');
        nameInput.focus();
        hasError = true;
      } else {
        clearError('name-error');
        nameInput.removeAttribute('aria-invalid');
      }

      // Failed validation never locks the guard
      if (hasError) return;

      // Success: lock guard BEFORE mutating DOM
      isSubmitting = true;
      orderPlaced  = true;
      document.getElementById('place-order-btn').disabled = true;

      // Take immutable snapshot of state
      const totalCents = orderTotalCents();
      const ref = generateRef();
      const customerName = trimmed;
      const now = new Date();
      const isoString = now.toISOString();

      let readableDate;
      try {
        readableDate = new Intl.DateTimeFormat('en-US', {
          dateStyle: 'medium',
          timeStyle: 'short',
          timeZone: 'UTC',
          timeZoneName: 'short'
        }).format(now);
      } catch (e) {
        readableDate = new Intl.DateTimeFormat('en-US', {
          dateStyle: 'medium',
          timeStyle: 'short',
          timeZone: 'UTC'
        }).format(now) + ' UTC';
      }

      const itemsSnapshot = [...cart.entries()].map(([k, { priceCents, qty }]) => ({
        label: PRODUCTS[k].label,
        qty,
        priceCents,
        lineCents: priceCents * qty,
      }));

      // Build confirmation view safely with createElement & textContent
      const mount = document.getElementById('confirmation-mount');
      mount.replaceChildren();

      const confBox = document.createElement('div');
      confBox.className = 'confirm-box';
      confBox.setAttribute('data-testid', 'confirmation');

      const heading = document.createElement('h2');
      heading.textContent = 'Order confirmed';
      confBox.appendChild(heading);

      const detailsDiv = document.createElement('div');
      detailsDiv.className = 'confirm-details';

      const refP = document.createElement('p');
      refP.textContent = 'Reference: ';
      const refSpan = document.createElement('span');
      refSpan.id = 'order-reference';
      refSpan.className = 'ref-code';
      refSpan.setAttribute('data-testid', 'order-reference');
      refSpan.textContent = ref;
      refP.appendChild(refSpan);
      detailsDiv.appendChild(refP);

      const nameP = document.createElement('p');
      nameP.textContent = 'Customer: ';
      const nameSpan = document.createElement('span');
      nameSpan.id = 'confirmation-name';
      nameSpan.setAttribute('data-testid', 'confirmation-name');
      nameSpan.textContent = customerName;
      nameP.appendChild(nameSpan);
      detailsDiv.appendChild(nameP);

      const dateP = document.createElement('p');
      dateP.textContent = 'Date / Time: ';
      const timeEl = document.createElement('time');
      timeEl.id = 'confirmation-datetime';
      timeEl.setAttribute('data-testid', 'confirmation-datetime');
      timeEl.setAttribute('datetime', isoString);
      timeEl.textContent = readableDate;
      dateP.appendChild(timeEl);
      detailsDiv.appendChild(dateP);

      confBox.appendChild(detailsDiv);

      const itemsUl = document.createElement('ul');
      itemsUl.id = 'confirmation-items';
      itemsUl.className = 'item-list';
      itemsUl.setAttribute('data-testid', 'confirmation-items');

      for (const item of itemsSnapshot) {
        const li = document.createElement('li');
        const spanDesc = document.createElement('span');
        spanDesc.textContent = `${item.label} × ${item.qty} (@ ${formatCents(item.priceCents)})`;
        const spanLineTot = document.createElement('span');
        spanLineTot.textContent = formatCents(item.lineCents);
        li.appendChild(spanDesc);
        li.appendChild(spanLineTot);
        itemsUl.appendChild(li);
      }
      confBox.appendChild(itemsUl);

      const totalRow = document.createElement('div');
      totalRow.className = 'confirm-total-row';
      const totalLabel = document.createElement('span');
      totalLabel.textContent = 'Order total';
      const totalVal = document.createElement('span');
      totalVal.id = 'confirmation-total';
      totalVal.setAttribute('data-testid', 'confirmation-total');
      totalVal.textContent = formatCents(totalCents);
      totalRow.appendChild(totalLabel);
      totalRow.appendChild(totalVal);
      confBox.appendChild(totalRow);

      const newOrderBtn = document.createElement('button');
      newOrderBtn.type = 'button';
      newOrderBtn.className = 'btn-new';
      newOrderBtn.id = 'new-order-btn';
      newOrderBtn.setAttribute('data-testid', 'new-order');
      newOrderBtn.textContent = 'Start new order';
      newOrderBtn.addEventListener('click', resetAll);
      confBox.appendChild(newOrderBtn);

      mount.appendChild(confBox);

      // Hide checkout view
      document.getElementById('checkout-view').style.display = 'none';
      announce('Order confirmed. Reference is ' + ref);
    }

    document.getElementById('place-order-btn').addEventListener('click', placeOrder);

    nameInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') placeOrder();
    });

    /* ── Start New Order ──────────────────────────────────── */

    function resetAll() {
      cart.clear();
      isSubmitting = false;
      orderPlaced  = false;

      nameInput.value = '';
      nameInput.removeAttribute('aria-invalid');

      clearError('cart-error');
      clearError('name-error');
      document.getElementById('qty-max-message').style.display = 'none';

      document.getElementById('place-order-btn').disabled = false;

      // Remove confirmation completely from DOM
      const mount = document.getElementById('confirmation-mount');
      mount.replaceChildren();

      // Show checkout view
      document.getElementById('checkout-view').style.display = '';

      render();
    }

    /* ── Initial Render ───────────────────────────────────── */
    render();
  </script>
